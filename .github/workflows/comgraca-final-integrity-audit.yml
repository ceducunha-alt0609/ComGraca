name: Run ComGraca final integrity audit
on:
  push:
    paths:
      - '.github/workflows/comgraca-final-integrity-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run audit
        run: python comgraca_final_integrity_audit.py
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add comgraca_final_integrity_report.txt
          git commit -m 'Generate ComGraca final integrity audit'
          git push
