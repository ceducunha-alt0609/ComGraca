name: Temporary ComGraca backup patch
on:
  push:
    paths:
      - '.github/workflows/comgraca-audit2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch backup validation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old='''  var exportBackup = function exportBackup() {
    var json = JSON.stringify(allData, null, 2);
    var blob = new Blob([json], {
      type: "application/json"
    });'''
          new='''  var exportBackup = function exportBackup() {
    var backupData = _objectSpread({
      _backupMeta: {
        app: "ComGraca",
        version: 4,
        exportedAt: new Date().toISOString()
      }
    }, allData);
    var json = JSON.stringify(backupData, null, 2);
    var blob = new Blob([json], {
      type: "application/json"
    });'''
          assert old in s, 'export anchor not found'
          s=s.replace(old,new,1)

          old2='''        var data = JSON.parse(ev.target.result);
        if (data.sales || data.prods || data.recs) {
          setAllData(data);
          alert("✅ Dados restaurados com sucesso!");
        } else {
          alert("❌ Arquivo inválido.");
        }'''
          new2='''        var data = JSON.parse(ev.target.result);
        var isObj = data && typeof data === "object" && !Array.isArray(data);
        var arrayFields = ["ingrs", "recs", "prods", "sales", "kits", "pack"];
        var arraysOk = isObj && arrayFields.every(function (key) {
          return data[key] === undefined || Array.isArray(data[key]);
        });
        var hasCoreData = arraysOk && ["sales", "prods", "recs"].some(function (key) {
          return Array.isArray(data[key]);
        });
        var metaOk = !data._backupMeta || data._backupMeta.app === "ComGraca";
        if (hasCoreData && metaOk) {
          setAllData(data);
          alert("✅ Dados restaurados com sucesso!");
        } else {
          alert("❌ Arquivo inválido ou incompatível com o Com Graça.");
        }'''
          assert old2 in s, 'import anchor not found'
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8')
          oldcache='const CACHE = "comgraca-v5-isolated-cache";'
          assert oldcache in w, 'cache anchor not found'
          w=w.replace(oldcache,'const CACHE = "comgraca-v6-backup-safe";',1)
          sw.write_text(w,encoding='utf-8')
          PY
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '_backupMeta' in s
          assert 'arrayFields.every' in s
          assert 'incompatível com o Com Graça' in s
          w=Path('sw.js').read_text(encoding='utf-8')
          assert 'comgraca-v6-backup-safe' in w
          assert 'k.startsWith(CACHE_PREFIX)' in w
          print('OK')
          PY
      - name: Commit app changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Harden ComGraca backup restore validation'
          git push
# trigger 2
