name: ComGraca receipt-date audit patch
on:
  push:
    paths:
      - '.github/workflows/comgraca-receipts.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch financial receipts and backup safety
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def rep(old,new,label,count=1):
              global s
              got=s.count(old)
              assert got >= count, f'{label}: expected at least {count}, got {got}'
              s=s.replace(old,new,count)

          # New paid sales get an explicit receipt date/method; debts get them when settled.
          rep('''        method: form.method,
        paid: paid,
        qty: +form.qty,''','''        method: form.method,
        paid: paid,
        paidDate: paid ? form.date : null,
        paidMethod: paid ? form.method : null,
        qty: +form.qty,''','avulso receipt fields')
          rep('''        method: form.method,
        paid: paid,
        qty: barsWillUse,''','''        method: form.method,
        paid: paid,
        paidDate: paid ? form.date : null,
        paidMethod: paid ? form.method : null,
        qty: barsWillUse,''','kit receipt fields')

          old_toggle='''  var togglePaid = function togglePaid(id) {
    return setSales(function (s) {
      return s.map(function (v) {
        return v.id === id ? _objectSpread(_objectSpread({}, v), {}, {
          paid: !v.paid
        }) : v;
      });
    });
  };'''
          new_toggle='''  var togglePaid = function togglePaid(id) {
    var target = sales.find(function (v) {
      return v.id === id;
    });
    if (!target) return;
    if (target.paid) {
      setSales(function (list) {
        return list.map(function (v) {
          return v.id === id ? _objectSpread(_objectSpread({}, v), {}, {
            paid: false,
            paidDate: null,
            paidMethod: null
          }) : v;
        });
      });
      return;
    }
    var payMethod = window.prompt("Forma de recebimento (Pix ou Dinheiro):", target.paidMethod || "Pix");
    if (payMethod === null) return;
    payMethod = payMethod.trim() || "Pix";
    var payDate = window.prompt("Data do recebimento (AAAA-MM-DD):", today());
    if (payDate === null) return;
    payDate = payDate.trim();
    if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(payDate)) {
      alert("Data inválida. Use AAAA-MM-DD.");
      return;
    }
    setSales(function (list) {
      return list.map(function (v) {
        return v.id === id ? _objectSpread(_objectSpread({}, v), {}, {
          paid: true,
          paidDate: payDate,
          paidMethod: payMethod
        }) : v;
      });
    });
  };'''
          rep(old_toggle,new_toggle,'togglePaid')

          # Month chart: receipts are counted by receipt month; pending/bars remain sale-month facts.
          old_months='''  var months = useMemo(function () {
    var set = new Set(sales.map(function (s) {
      return s.date.slice(0, 7);
    }));
    var sorted = _toConsumableArray(set).sort();'''
          new_months='''  var months = useMemo(function () {
    var set = new Set();
    sales.forEach(function (s) {
      if (s.date) set.add(s.date.slice(0, 7));
      if (s.paid && (s.paidDate || s.date)) set.add((s.paidDate || s.date).slice(0, 7));
    });
    var sorted = _toConsumableArray(set).sort();'''
          rep(old_months,new_months,'chart months')

          old_paid='''      var paid = ms.filter(function (s) {
        return s.paid;
      }).reduce(function (a, s) {
        return a + saleTotal(s, kits);
      }, 0);'''
          new_paid='''      var paid = sales.filter(function (s) {
        return s.paid && (s.paidDate || s.date).startsWith(mo);
      }).reduce(function (a, s) {
        return a + saleTotal(s, kits);
      }, 0);'''
          rep(old_paid,new_paid,'chart paid receipts')

          # Dashboard current-month revenue follows receipt date, not sale date.
          old_dash='''  var mRev = mSales.filter(function (s) {
    return s.paid;
  }).reduce(function (a, s) {
    return a + saleTotal(s, kits);
  }, 0);'''
          new_dash='''  var mRev = sales.filter(function (s) {
    return s.paid && (s.paidDate || s.date).startsWith(cm);
  }).reduce(function (a, s) {
    return a + saleTotal(s, kits);
  }, 0);'''
          rep(old_dash,new_dash,'dashboard receipts')

          # Report month picker also includes months that only contain later debt receipts.
          old_report_months='''  var months = useMemo(function () {
    var s = new Set([].concat(_toConsumableArray(sales.map(function (s) {
      return s.date.slice(0, 7);
    })), _toConsumableArray(prods.map(function (p) {
      return p.date.slice(0, 7);
    }))));
    return _toConsumableArray(s).sort().reverse();
  }, [sales, prods]);'''
          new_report_months='''  var months = useMemo(function () {
    var s = new Set([].concat(_toConsumableArray(sales.map(function (sale) {
      return sale.date.slice(0, 7);
    })), _toConsumableArray(prods.map(function (p) {
      return p.date.slice(0, 7);
    }))));
    sales.forEach(function (sale) {
      if (sale.paid && (sale.paidDate || sale.date)) s.add((sale.paidDate || sale.date).slice(0, 7));
    });
    return _toConsumableArray(s).sort().reverse();
  }, [sales, prods]);'''
          rep(old_report_months,new_report_months,'report months')

          old_report_paid='''  var mPaidRev = mSales.filter(function (s) {
    return s.paid;
  }).reduce(function (a, s) {
    return a + saleTotal(s, kits);
  }, 0);'''
          new_report_paid='''  var mPaidRev = sales.filter(function (s) {
    return s.paid && (s.paidDate || s.date).startsWith(selMonth);
  }).reduce(function (a, s) {
    return a + saleTotal(s, kits);
  }, 0);'''
          rep(old_report_paid,new_report_paid,'report receipts')

          # CSV gains settlement audit trail while remaining sale-month scoped.
          rep('''    var rows = [["Data", "Cliente", "Produto", "Quantidade", "Preço", "Total", "Forma", "Status"]];''','''    var rows = [["Data da venda", "Cliente", "Produto", "Quantidade", "Preço", "Total", "Forma na venda", "Status", "Recebido em", "Recebido via"]];''','csv header')
          rep('''      rows.push([s.date, s.customer, label, s.qty, s.price.toFixed(2), saleTotal(s, kits).toFixed(2), s.method, s.paid ? "Pago" : "Pendente"]);''','''      rows.push([s.date, s.customer, label, s.qty, s.price.toFixed(2), saleTotal(s, kits).toFixed(2), s.method, s.paid ? "Pago" : "Pendente", s.paid ? (s.paidDate || s.date) : "", s.paid ? (s.paidMethod || s.method) : ""]);''','csv receipt fields')

          # Show the actual settlement method for debts that were later paid.
          display_old='''    }, s.method)), /*#__PURE__*/React.createElement("td", null, /*#__PURE__*/React.createElement("span", {
      className: "badge ".concat(s.paid ? "bgg" : "bgr")'''
          display_new='''    }, s.paid && s.paidMethod && s.method === "Em haver" ? "Em haver → ".concat(s.paidMethod) : s.method)), /*#__PURE__*/React.createElement("td", null, /*#__PURE__*/React.createElement("span", {
      className: "badge ".concat(s.paid ? "bgg" : "bgr")'''
          rep(display_old,display_new,'payment display',count=2)

          # Backup export gets provenance; restore requires a coherent ComGraca structure.
          rep('''  var exportBackup = function exportBackup() {
    var json = JSON.stringify(allData, null, 2);''','''  var exportBackup = function exportBackup() {
    var backupData = _objectSpread({
      _backupMeta: {
        app: "ComGraca",
        version: 5,
        exportedAt: new Date().toISOString()
      }
    }, allData);
    var json = JSON.stringify(backupData, null, 2);''','backup export')

          old_import='''        var data = JSON.parse(ev.target.result);
        if (data.sales || data.prods || data.recs) {
          setAllData(data);
          alert("✅ Dados restaurados com sucesso!");
        } else {
          alert("❌ Arquivo inválido.");
        }'''
          new_import='''        var data = JSON.parse(ev.target.result);
        var isObj = data && typeof data === "object" && !Array.isArray(data);
        var requiredArrays = ["ingrs", "recs", "prods", "sales", "kits", "pack"];
        var arraysOk = isObj && requiredArrays.every(function (key) {
          return Array.isArray(data[key]);
        });
        var settingsOk = isObj && data.settings && typeof data.settings === "object" && !Array.isArray(data.settings);
        var metaOk = !data._backupMeta || data._backupMeta.app === "ComGraca";
        if (arraysOk && settingsOk && metaOk) {
          setAllData(data);
          alert("✅ Dados restaurados com sucesso!");
        } else {
          alert("❌ Arquivo inválido ou incompatível com o Com Graça.");
        }'''
          rep(old_import,new_import,'backup import')

          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8')
          assert 'const CACHE = "comgraca-v5-isolated-cache";' in w
          w=w.replace('const CACHE = "comgraca-v5-isolated-cache";','const CACHE = "comgraca-v6-receipts-safe";',1)
          sw.write_text(w,encoding='utf-8')
          PY
      - name: Verify invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            'paidDate: paid ? form.date : null',
            'paidMethod: paid ? form.method : null',
            'paidDate: payDate',
            '(s.paidDate || s.date).startsWith(cm)',
            '(s.paidDate || s.date).startsWith(selMonth)',
            '"Recebido em", "Recebido via"',
            'requiredArrays.every',
            '_backupMeta',
          ]
          for x in checks: assert x in s, x
          assert s.count('paidDate: paid ? form.date : null') == 2
          assert 'var mPaidRev = mSales.filter' not in s
          assert 'var mRev = mSales.filter' not in s
          w=Path('sw.js').read_text(encoding='utf-8')
          assert 'comgraca-v6-receipts-safe' in w
          assert 'k.startsWith(CACHE_PREFIX)' in w
          print('ComGraca receipts + backup invariants OK')
          PY
      - name: Commit and clean temporary audit files
        run: |
          rm -f .github/workflows/comgraca-receipts.yml .github/workflows/comgraca-smoke.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Track ComGraca receipt dates and harden backups'
          git push
