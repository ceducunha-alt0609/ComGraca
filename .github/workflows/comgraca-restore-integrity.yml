name: Run ComGraca restore integrity patch
on:
  push:
    paths:
      - '.github/workflows/comgraca-restore-integrity.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python comgraca_patch_restore_integrity.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f comgraca_patch_restore_integrity.py .github/workflows/comgraca-restore-integrity.yml comgraca_final_integrity_audit.py .github/workflows/comgraca-final-integrity-audit.yml comgraca_final_integrity_report.txt
          git add -A
          git commit -m 'Harden ComGraca restore integrity checks'
          git push
