name: Run ComGraca dependency guards patch
on:
  push:
    paths:
      - '.github/workflows/comgraca-dependency-guards.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python comgraca_patch_dependency_guards.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f comgraca_patch_dependency_guards.py .github/workflows/comgraca-dependency-guards.yml
          git add -A
          git commit -m 'Guard ComGraca recipe dependencies'
          git push
