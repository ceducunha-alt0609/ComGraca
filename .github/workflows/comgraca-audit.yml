name: Temporary ComGraca safety patch
on:
  push:
    paths:
      - '.github/workflows/comgraca-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified safety fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old='''var today = function today() {\n  return new Date().toISOString().slice(0, 10);\n};\nvar curMonth = function curMonth() {\n  return new Date().toISOString().slice(0, 7);\n};'''
          new='''var localDateKey = function localDateKey(d) {\n  d = d || new Date();\n  var y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");\n  return y + "-" + m + "-" + day;\n};\nvar today = function today() {\n  return localDateKey(new Date());\n};\nvar curMonth = function curMonth() {\n  return localDateKey(new Date()).slice(0, 7);\n};'''
          assert old in s, 'date anchor missing'
          s=s.replace(old,new,1)

          # First-run must not invent production/sales history. Existing saved data is untouched.
          s,n=re.subn(r'var PROD0 = \[.*?\];\nvar SALE0 = \[.*?\];\nvar KITS0 =', 'var PROD0 = [];\nvar SALE0 = [];\nvar KITS0 =', s, count=1, flags=re.S)
          assert n==1, f'demo history anchor count={n}'

          anchor='var ignoreNext = useRef(false); // evita loop ao receber update do Firestore'
          assert anchor in s, 'sync ref anchor missing'
          s=s.replace(anchor, anchor+'\n  var cloudHydrated = useRef(false); // impede upload antes da primeira leitura da nuvem',1)

          old_listen='''listen: (uid, cb) =>\n    onSnapshot(doc(db, "lojas", uid, "dados", "principal"), snap => {\n      if (snap.exists()) cb(snap.data());\n    }),'''
          new_listen='''listen: (uid, cb) =>\n    onSnapshot(doc(db, "lojas", uid, "dados", "principal"), snap => {\n      cb(snap.exists() ? snap.data() : null);\n    }),'''
          assert old_listen in s, 'firebase listen anchor missing'
          s=s.replace(old_listen,new_listen,1)

          old_fx='''  // ── Firestore: escutar mudanças em tempo real ──\n  useEffect(function () {\n    if (!fbReady || !user) return;\n    var unsub = fb.listen(user.uid, function (data) {\n      if (ignoreNext.current) {'''
          new_fx='''  // ── Firestore: escutar mudanças em tempo real ──\n  useEffect(function () {\n    if (!fbReady || !user) return;\n    cloudHydrated.current = false;\n    var unsub = fb.listen(user.uid, function (data) {\n      cloudHydrated.current = true;\n      if (!data) {\n        setSyncSt("syncing");\n        ignoreNext.current = true;\n        fb.save(user.uid, allData).then(function () { return setSyncSt("synced"); }).catch(function () { return setSyncSt("error"); });\n        return;\n      }\n      if (ignoreNext.current) {'''
          assert old_fx in s, 'listener effect anchor missing'
          s=s.replace(old_fx,new_fx,1)

          old_cond='''    if (fbReady && user) {\n      setSyncSt("syncing");'''
          new_cond='''    if (fbReady && user && cloudHydrated.current) {\n      setSyncSt("syncing");'''
          assert old_cond in s, 'save gate anchor missing'
          s=s.replace(old_cond,new_cond,1)

          # sanity checks
          assert 'new Date().toISOString().slice(0, 10)' not in s
          assert 'new Date().toISOString().slice(0, 7)' not in s
          assert 'var PROD0 = [];' in s and 'var SALE0 = [];' in s
          assert 'cloudHydrated.current' in s
          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8')
          assert 'const CACHE = "comgraca-v3";' in w
          w=w.replace('const CACHE = "comgraca-v3";','const CACHE = "comgraca-v4-audit-safety";',1)
          sw.write_text(w,encoding='utf-8')
          PY
      - name: Commit patch and clean temporary audit files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git rm -f comgraca_audit_report.txt .github/workflows/comgraca-audit.yml
          git commit -m 'Harden ComGraca first-run dates and cloud sync'
          git push
