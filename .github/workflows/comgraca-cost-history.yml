name: Run ComGraca production cost history patch
on:
  push:
    paths:
      - '.github/workflows/comgraca-cost-history.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python comgraca_patch_cost_history.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f comgraca_patch_cost_history.py .github/workflows/comgraca-cost-history.yml
          git add -A
          git commit -m 'Freeze ComGraca production cost history'
          git push
