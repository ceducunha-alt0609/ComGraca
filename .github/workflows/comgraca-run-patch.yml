name: Run ComGraca receipt patch
on:
  push:
    paths:
      - '.github/workflows/comgraca-run-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python comgraca_patch_receipts.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f comgraca_patch_receipts.py .github/workflows/comgraca-run-patch.yml .github/workflows/comgraca-smoke.yml .github/workflows/comgraca-receipts-core.yml
          git add -A
          git commit -m 'Track ComGraca receipt dates and harden backups'
          git push
