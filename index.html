<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7B3FA0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Com Graça">
<link rel="manifest" href="/ComGraca/manifest.json">
<link rel="apple-touch-icon" href="/ComGraca/icon-192.png">
<title>Com Graça · Sabão Artesanal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap">
<style>
#splash{position:fixed;inset:0;background:#F3EEFF;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s}
#splash .ico{font-size:72px;animation:bob .9s ease-in-out infinite alternate}
#splash p{margin-top:14px;color:#7B3FA0;font-size:14px;font-family:serif;letter-spacing:.5px}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-14px)}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden;-webkit-tap-highlight-color:transparent}

/* FAB */
.fab{position:fixed;bottom:76px;right:18px;z-index:400;width:56px;height:56px;border-radius:50%;background:var(--ter);color:#fff;border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 18px rgba(123,63,160,.45);display:flex;align-items:center;justify-content:center;transition:transform .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
.fab:active{transform:scale(.92);box-shadow:0 2px 8px rgba(123,63,160,.35)}
@media(min-width:861px){.fab{display:none}}

/* SWIPE ROW */
.swipe-row-wrap{position:relative;overflow:hidden;border-radius:11px;margin-bottom:8px}
.swipe-row-bg{position:absolute;inset:0;background:var(--sage);display:flex;align-items:center;justify-content:flex-end;padding-right:18px;border-radius:11px}
.swipe-row{position:relative;background:var(--fbox-bg);border:1.5px solid var(--bdr);border-radius:11px;transition:transform .2s ease;touch-action:pan-y;display:flex;align-items:center;gap:10px;padding:11px 14px;flex-wrap:wrap}
.swipe-row.swiped{transform:translateX(-80px)}

/* META HERO */
.meta-hero{background:linear-gradient(135deg,var(--ter),var(--brn));border-radius:var(--r);padding:20px;margin-bottom:14px;color:#fff}
.meta-hero .mh-label{font-size:11px;font-weight:700;opacity:.75;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.meta-hero .mh-val{font-size:32px;font-weight:700;font-family:'Merriweather',serif;line-height:1}
.meta-hero .mh-sub{font-size:13px;opacity:.8;margin-top:4px}
.meta-hero .mh-bar-wrap{background:rgba(255,255,255,.25);border-radius:8px;height:10px;margin-top:12px;overflow:hidden}
.meta-hero .mh-bar-fill{height:100%;border-radius:8px;background:#fff;transition:width .8s ease}
.meta-hero .mh-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;opacity:.85}

/* WA BTN */
.wa-btn{background:#25D366;color:#fff;border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-family:'Merriweather',serif}
</style>
</head>
<body>
<div id="splash">
  <svg width="96" height="96" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" style="animation:bob .9s ease-in-out infinite alternate">
    <rect width="80" height="80" rx="20" fill="#7B3FA0"/>
    <rect x="14" y="42" width="52" height="22" rx="8" fill="#fff" opacity=".95"/>
    <circle cx="28" cy="38" r="10" fill="#fff" opacity=".9"/>
    <circle cx="40" cy="34" r="12" fill="#fff" opacity=".95"/>
    <circle cx="52" cy="38" r="10" fill="#fff" opacity=".9"/>

    <circle cx="34" cy="50" r="3" fill="#D4B0E8"/>
    <circle cx="40" cy="47" r="3" fill="#D4B0E8"/>
    <circle cx="46" cy="50" r="3" fill="#D4B0E8"/>
  </svg>
  <p>Carregando Com Graça…</p>
</div>

<script type="module">
// ─────────────────────────────────────────────
// COLE SUA CONFIG DO FIREBASE ABAIXO:
// COLE_SUA_CONFIG_FIREBASE_AQUI
const firebaseConfig = {
  apiKey: "AIzaSyD8-ikF_QYRmU-QAsRZAqjARP7nI-iFN0w",
  authDomain: "comgraca-c207d.firebaseapp.com",
  projectId: "comgraca-c207d",
  storageBucket: "comgraca-c207d.firebasestorage.app",
  messagingSenderId: "821297526559",
  appId: "1:821297526559:web:cfd836c98a29b63a36e22a",
  measurementId: "G-2XJ86PL3FX"
};
// ─────────────────────────────────────────────

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, onSnapshot, initializeFirestore, persistentLocalCache }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);

// persistentMultipleTabManager causa conflito com getRedirectResult em PWA — usar cache simples
const db = initializeFirestore(app, {
  cache: persistentLocalCache()
});

const provider = new GoogleAuthProvider();

const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 768;

// Persistência local
await setPersistence(auth, browserLocalPersistence);

// Sinaliza que o Firebase está pronto
if (window._fbReadyResolve) window._fbReadyResolve();

window._fb = {
  auth, db, provider, isMobile,
  signIn: async () => {
    // Popup funciona em todos os casos — redirect tem bug com GitHub Pages + Firebase Auth moderno
    // (o iframe do authDomain é bloqueado pelo X-Frame-Options do GitHub Pages)
    try {
      const result = await signInWithPopup(auth, provider);
      return result;
    } catch (err) {
      const code = err?.code || "";
      // Popup bloqueado pelo browser → informa o usuário
      if (code === "auth/popup-blocked") {
        throw new Error("popup-blocked");
      }
      // Usuário fechou o popup → silencioso
      if (["auth/popup-closed-by-user", "auth/cancelled-popup-request"].includes(code)) {
        return null;
      }
      throw err;
    }
  },
  signOut: () => signOut(auth),
  onAuth: (cb) => {
    const unsub = onAuthStateChanged(auth, cb);
    return unsub;
  },
  getRedirect: async () => null,
  save: (uid, data) =>
    setDoc(doc(db, "lojas", uid, "dados", "principal"), data),
  listen: (uid, cb) =>
    onSnapshot(doc(db, "lojas", uid, "dados", "principal"), snap => {
      cb(snap.exists() ? snap.data() : null);
    }),
};

console.log("🔥 Firebase pronto", isMobile ? "(mobile→popup-first)" : "(desktop→popup)");
</script>
